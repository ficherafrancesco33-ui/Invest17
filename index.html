<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Keystone</title>
<meta name="description" content="Analisi di immobili da mettere a reddito: valore, comparabili, rendimenti e notizie">
<meta name="theme-color" content="#111823">
<script>document.documentElement.dataset.th="notte"</script>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Keystone">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
/* ===== Stile CYBER (preso da Dreamers): nero con ciano e magenta, vetro con riflessi ===== */
:root{
  --bg:var(--bg);--panel:var(--card);--panel2:var(--card2);--line:var(--line);--line2:rgba(var(--accrgb),.14);
  --tx:var(--headtx);--tx2:#d4cdb8;--muted:#a8a08a;
  --cy:#c9a227;--cy2:#f2cf5b;--mg:#f5d76e;--yl:#facc15;--on:#14100a;
  --hd1:var(--card2);--hd2:var(--deep);
  --good:#22c55e;--warn:#f59e0b;--bad:#ef4444;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
:root{--card:#141414;--card2:#1e1e1e;--deep:#0b0b0b;--head:#101010;--headtx:#f3efe2;--line2:#5a4818;--soft:#2a2418;--strong:#ffffff;--accrgb:201,162,39}
:root[data-th=sabbia]{--bg:#faf5ee;--panel:#ffffff;--panel2:#f6eee4;--card:#ffffff;--card2:#f6eee4;--deep:#f1e7da;--head:#2d4a53;--headtx:#fdf8f1;--line:#e6d6c4;--line2:#d7b49b;--soft:#f6e3d6;--line2x:#d7b49b;
  --tx:#2b2622;--tx2:#4f463f;--muted:#857a70;--strong:#1e1a16;--cy:#c0582c;--cy2:#a8471f;--mg:#2d4a53;--yl:#f2b84b;--on:#ffffff;--hd1:#2d4a53;--hd2:#2d4a53;--good:#2f8a4c;--accrgb:192,88,44;color-scheme:light}
:root[data-th=notte]{--bg:#18202c;--panel:#243042;--panel2:#2e3b51;--card:#243042;--card2:#2e3b51;--deep:#111823;--head:#111823;--headtx:#f2f4f7;--line:#33415a;--line2:#4a5a76;--soft:#2e3b51;
  --tx:#eef2f7;--tx2:#c9d3e0;--muted:#9aa8bb;--strong:#ffffff;--cy:#f2b84b;--cy2:#f5c86a;--mg:#f2b84b;--on:#2a1d05;--hd1:#111823;--hd2:#111823;--accrgb:242,184,75}
:root[data-th=dream]{--bg:#120a33;--panel:#1e1650;--panel2:#281d63;--card:#1e1650;--card2:#281d63;--deep:#0d0726;--head:#0d0726;--headtx:#f1ecff;--line:#3b2d7a;--line2:#6d4fc4;--soft:#2a1f66;
  --tx:#f1ecff;--tx2:#d9cdfa;--muted:#b9a8e6;--strong:#ffffff;--cy:#a855f7;--cy2:#d8b4fe;--mg:#c084fc;--on:#ffffff;--hd1:#0d0726;--hd2:#0d0726;--accrgb:168,85,247}
:root[data-th=dream] body{background:radial-gradient(900px 500px at 85% -10%,rgba(168,85,247,.25),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(59,130,246,.15),transparent 60%),linear-gradient(180deg,#1a0f4a,var(--bg) 40%)}
:root[data-th=sabbia] body{background:var(--bg)}
:root[data-th=notte] body{background:linear-gradient(180deg,#1d2635,var(--bg) 40%)}
:root[data-th=sabbia] .nav a{color:#d6e3e6;background:rgba(255,255,255,.1)}
:root[data-th=sabbia] .chip:not(.on),:root[data-th=sabbia] select,:root[data-th=sabbia] input,:root[data-th=sabbia] .hback{background:#fff;color:var(--tx)}
:root[data-th=sabbia] .chip.on{color:var(--on)}
:root[data-th=sabbia] h1{text-shadow:none}
:root[data-th=sabbia] .price b{color:var(--cy);text-shadow:none}
:root[data-th=sabbia] .verdict,:root[data-th=sabbia] .vhead,:root[data-th=sabbia] .mblock>div,:root[data-th=sabbia] .uso.best{background:var(--panel2)}
:root[data-th=sabbia] .hubc,:root[data-th=sabbia] .btn4 a{background:#fff}
:root[data-th=sabbia] .hubc.big{background:linear-gradient(135deg,#f6e3d6,#fff 60%)}:root[data-th=sabbia] .kpi,:root[data-th=sabbia] .card{box-shadow:0 2px 8px rgba(60,40,20,.08)}
:root[data-th=sabbia] .mmsheet{background:#fff;color:var(--tx)}
:root[data-th=sabbia] .leaflet-popup-content-wrapper,:root[data-th=sabbia] .leaflet-popup-tip,:root[data-th=sabbia] .maplibregl-popup-content{background:#fff;color:var(--tx)}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  background:radial-gradient(900px 500px at 85% -10%,rgba(var(--accrgb),.10),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(var(--accrgb),.06),transparent 60%),linear-gradient(180deg,var(--deep),var(--bg) 40%)}
a{color:var(--cy2)}
button{font-family:inherit}
[hidden]{display:none!important}
img{max-width:100%}

/* ---- intestazione: vetro con riflesso ---- */
.top{position:sticky;top:0;z-index:1200;background:var(--head);box-shadow:0 2px 0 var(--cy),0 8px 20px rgba(0,0,0,.6);padding-top:env(safe-area-inset-top,0px)}
.toprow{display:flex;align-items:center;gap:10px;padding:9px 12px 8px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--strong)}
.logo i{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:22px;color:var(--on);
  background:linear-gradient(180deg,var(--cy2),var(--cy));box-shadow:0 0 18px rgba(var(--accrgb),.55),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.logo i::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));border-radius:12px 12px 40% 40%}
.logo b{font-family:var(--display);font-style:italic;font-weight:800;font-size:32px;letter-spacing:.05em;text-transform:uppercase;line-height:.95;color:var(--headtx)}
.logo b small{display:block;font-family:var(--body);font-style:normal;font-weight:600;font-size:8.5px;letter-spacing:.2em;color:var(--cy);margin-top:3px;white-space:nowrap}
.logo i svg{width:33px;height:33px;position:relative;z-index:1}
.logo.ruota i{animation:lspin .7s cubic-bezier(.5,0,.3,1) infinite;transform-origin:50% 50%}
.antw{position:relative;overflow:hidden;border-radius:8px;background:#fff;min-height:120px}.antf{position:absolute;left:0;top:0;width:794px;height:1123px;border:0;transform-origin:0 0;background:#fff}
.plist{display:flex;flex-direction:column;gap:8px}
.pcard{position:relative;display:grid;grid-template-columns:1fr auto;gap:4px 10px;padding:12px 44px 12px 14px;border:1px solid var(--line);border-radius:14px;background:var(--card);text-decoration:none;color:var(--tx)}
.pcard .pc1 b{display:block;font-size:15px;color:var(--strong)}.pcard .pc1 span{font-size:12px;color:var(--muted)}
.pcard .pc2{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}.pcard .pc2 span{font-size:11.5px;padding:2px 8px;border-radius:20px;background:rgba(255,255,255,.06);color:var(--tx)}
.pcard .pc3{grid-row:1;grid-column:2;text-align:right}.pcard .pc3 b{display:block;font-size:16px;color:var(--cy)}.pcard .pc3 em{font-style:normal;font-size:11.5px;color:var(--muted)}.pcard .pc3 i{font-style:normal}
.pcard .star{position:absolute;right:10px;top:50%;transform:translateY(-50%)}
.pvmap{border-radius:14px;overflow:hidden;margin:6px 0 4px;pointer-events:none}.pvmap .mapw{position:relative;overflow:hidden;max-width:100%}
.pvmap .tiles{position:absolute;inset:0;filter:grayscale(.2) brightness(.92)}.pvmap .tiles img{position:absolute;width:256px;height:256px}.pvmap .osm{position:absolute;right:4px;bottom:2px;font-size:9px;color:#333;background:rgba(255,255,255,.7);padding:0 3px}
.pvmap .pin{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:#6e1423;border:3px solid #fff;box-shadow:0 0 0 2px #f2b84b,0 0 0 10px rgba(242,184,75,.25)}
.pvtab{width:100%;border-collapse:collapse;font-size:14px}.pvtab td{padding:8px 4px;border-bottom:1px solid var(--line);vertical-align:top}.pvtab td:first-child{color:var(--muted);width:38%}
#pdfov{position:fixed;inset:0;z-index:5000;background:rgba(8,12,20,.72);display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px)}
#pdfov .pdfbox{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 20px;max-width:360px;width:100%;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;box-shadow:0 10px 40px rgba(0,0,0,.5)}
#pdfov b{color:var(--strong);font-size:18px}#pdfov span{color:var(--muted);font-size:14px}#pdfov .btn{width:100%}
.cmleg{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin:6px 0 10px}.cmleg i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
@keyframes lspin{to{transform:rotate(360deg)}}
.pgback{display:inline-flex;align-items:center;gap:4px;margin:0 0 10px -2px;padding:6px 12px 6px 8px;border-radius:999px;border:1px solid var(--line2);background:var(--card);color:var(--cy2);
  font-family:var(--display);font-style:italic;font-weight:800;font-size:14px;letter-spacing:.06em;text-transform:uppercase;cursor:pointer}
.pgback svg{width:16px;height:16px}
.top .sp{flex:1}
.hback{width:40px;height:40px;flex:none;display:grid;place-items:center;border-radius:12px;border:1px solid var(--line2);background:var(--card2);color:var(--cy2);cursor:pointer;margin-right:-4px}
.hback svg{width:22px;height:22px}
.taxsw{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.taxsw button{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;cursor:pointer}
.taxsw button.on{background:linear-gradient(180deg,var(--cy2),var(--cy));color:var(--on);box-shadow:0 0 10px rgba(var(--accrgb),.5)}

/* ---- barra di navigazione a schede inclinate ---- */
.nav{display:flex;gap:5px;overflow-x:auto;padding:2px 12px 9px;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:1 1 0;min-width:0;display:flex;align-items:center;justify-content:center;gap:5px;padding:8px 2px;text-decoration:none;color:var(--muted);transform:skewX(-14deg);
  background:rgba(255,255,255,.06);border-radius:3px;
  font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap}
.nav a>*{transform:skewX(14deg)}
.nav a svg{width:15px;height:15px;flex:none}
@media (max-width:620px){.nav a svg{display:none}.nav a{font-size:12px;letter-spacing:0}.nav{gap:4px;padding-left:8px;padding-right:8px}.nav a[data-v=inv]{flex-grow:1.6}}
.nav a.on{background:linear-gradient(180deg,var(--cy2),var(--cy));color:var(--on);box-shadow:0 0 16px rgba(var(--accrgb),.45)}

main{max-width:980px;margin:0 auto;padding:18px 14px 0}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;margin:0}
h1{font-size:30px;line-height:1.02;letter-spacing:.03em;text-shadow:0 0 22px rgba(var(--accrgb),.25)}
h2{font-size:17px;letter-spacing:.14em;color:var(--mg);margin:26px 0 10px;display:flex;align-items:center;gap:8px;text-shadow:0 0 14px rgba(var(--accrgb),.35)}
h2 small{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin-left:auto;text-shadow:none}
h2 small a{color:var(--cy2);text-decoration:none}
.sub{color:var(--muted);font-size:13.5px;margin:6px 0 0}

/* ---- pannelli ---- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),linear-gradient(180deg,var(--card),var(--deep));border:1px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.35)}
.card.neon{border-top:2px solid var(--mg);border-bottom:2px solid var(--mg);box-shadow:0 0 18px rgba(var(--accrgb),.18),inset 0 1px 0 rgba(255,255,255,.06)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 50%),var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.kpi small{display:block;font-family:var(--display);font-style:italic;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;color:var(--strong)}
.kpi b.cy{color:var(--cy2);text-shadow:0 0 14px rgba(var(--accrgb),.5)}
.kpi span{display:block;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed rgba(var(--accrgb),.25);border-radius:22px;padding:24px 16px;text-align:center;color:var(--tx2);background:rgba(10,18,32,.6)}
.empty b{display:block;font-family:var(--display);font-style:italic;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--cy2);margin-bottom:6px}
.empty p{margin:6px 0 0;font-size:13.5px}

/* ---- chip e filtri ---- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--panel);color:var(--tx2);border-radius:999px;padding:6px 11px;font-family:var(--display);font-style:italic;font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(180deg,var(--cy2),var(--cy));border-color:var(--cy2);color:var(--on);box-shadow:0 0 12px rgba(var(--accrgb),.45)}
.filters{display:grid;gap:8px;margin:12px -14px 14px;padding:10px 14px;background:var(--deep);border-top:1px solid var(--soft);border-bottom:1px solid var(--soft)}
.filters::before{content:"Filtri";font-family:var(--display);font-style:italic;font-weight:800;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--cy)}
.filters .chips{flex-wrap:nowrap}
.selrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:1px}.selrow::-webkit-scrollbar{display:none}
.selrow select,.selrow input{flex:none;width:auto;max-width:72vw}.selrow span:empty{display:none}
.selrow select{appearance:none;-webkit-appearance:none;padding-right:28px;background-image:linear-gradient(45deg,transparent 50%,var(--cy) 50%),linear-gradient(135deg,var(--cy) 50%,transparent 50%);background-position:calc(100% - 15px) 52%,calc(100% - 10px) 52%;background-size:5px 5px;background-repeat:no-repeat}
select{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:13px;font-family:inherit;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--cy);width:16px;height:16px}

/* ---- finestra (foto con vetro e riflesso, come i loghi di Dreamers) ---- */
.win{--wc:var(--cy);position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--wc) 55%,var(--card)),var(--deep));background-size:cover;background-position:center;
  border:1.5px solid color-mix(in srgb,var(--wc) 70%,#fff 10%);border-bottom:4px solid color-mix(in srgb,var(--wc) 45%,#000);
  box-shadow:0 0 18px color-mix(in srgb,var(--wc) 45%,transparent),0 10px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.win::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 38%,rgba(255,255,255,0) 50%),linear-gradient(115deg,transparent 55%,rgba(255,255,255,.12) 62%,transparent 70%);pointer-events:none;z-index:1}
.win::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -18px 26px rgba(0,0,0,.45);pointer-events:none;z-index:1}
.win .art{position:absolute;inset:0;width:100%;height:100%}
.win .artlab{position:absolute;left:6px;top:6px;z-index:2;font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:rgba(243,239,226,.7);background:rgba(0,0,0,.45);padding:1px 6px;border-radius:5px}
.win .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:38px;color:rgba(255,255,255,.85);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---- card immobile ---- */
.list{display:grid;gap:12px}
.im{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:start;text-decoration:none;color:var(--tx);position:relative;padding:12px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 40%),linear-gradient(180deg,var(--card),var(--deep));border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.3);transition:transform .12s,border-color .12s,box-shadow .12s}
.im:active{transform:scale(.985)}
.im:hover{border-color:rgba(var(--accrgb),.45);box-shadow:0 0 18px rgba(var(--accrgb),.2)}
.im .win{width:104px;height:104px}
.rank{position:absolute;top:-7px;left:-7px;width:28px;height:28px;border-radius:9px;background:linear-gradient(180deg,#fde047,var(--yl));color:#1a1300;font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;display:grid;place-items:center;z-index:3;box-shadow:0 0 12px rgba(250,204,21,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.imt{min-width:0;display:flex;flex-direction:column;gap:4px}
.loc{font-family:var(--display);font-style:italic;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imt h3{font-family:var(--body);font-style:normal;text-transform:none;letter-spacing:0;font-weight:700;font-size:15px;line-height:1.25;color:var(--strong);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.meta b{color:var(--strong)}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{font-family:var(--display);font-style:italic;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--tx2)}
.tag.cat{border-color:rgba(var(--accrgb),.45);color:var(--cy2)}
.tag.new{background:var(--yl);border-color:var(--yl);color:#1a1300}
.tag.est{border-color:rgba(245,158,11,.5);color:#fbbf55}
.win .pill{position:absolute;right:6px;bottom:6px;z-index:2;font-size:19px;padding:2px 8px 1px}
.pill{display:inline-block;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;padding:3px 10px 2px;border-radius:9px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--pc,var(--muted));box-shadow:0 0 12px color-mix(in srgb,var(--pc,var(--muted)) 55%,transparent),inset 0 -2px 0 rgba(0,0,0,.2)}
.tag.st{border-color:currentColor}

table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}

<script>
"use strict";
/* ============ utilità ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => n == null || isNaN(n) ? "—" : "€\u00a0" + Math.round(n).toLocaleString("it-IT");
const keur = n => n == null || isNaN(n) ? "—" : (Math.abs(n) >= 1000 ? "€\u00a0" + (n/1000).toLocaleString("it-IT",{maximumFractionDigits:n>=100000?0:1}) + "k" : eur(n));
const pct = (n, d = 1) => n == null || isNaN(n) ? "—" : (n*100).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const num = (n, d = 0) => n == null || isNaN(n) ? "—" : n.toLocaleString("it-IT",{maximumFractionDigits:d});
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
const MESI = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const CAT = { breve:"B&B e affitto breve", medio:"Medio termine", lungo:"Affitto lungo" };
const CATS = { breve:"B&B", medio:"Medio", lungo:"Lungo" };
const store = { get(k, d) { try { const v = localStorage.getItem("i17_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("i17_" + k, JSON.stringify(v)); } catch {} } };
const TAX = "privata";   // tutti i conti come persona fisica (cedolare secca), su richiesta di Imma

/* ============ calcoli (unica fonte per tutti i numeri) ============ */
function par(im, path) {
  const get = (o) => path.split(".").reduce((x, k) => x == null ? undefined : x[k], o);
  const v = get(im.parametri || {});
  return v !== undefined ? v : get(IMPOSTAZIONI);
}
function valuta(im) {
  const v = im.valutazione || {}, comps = (v.comparabili || []).filter(c => c.prezzo && c.mq);
  const compMq = median(comps.map(c => c.prezzo / c.mq));
  const compAdj = compMq == null ? null : compMq * (1 - par(im, "sconto_trattativa"));
  const omiMid = v.omi ? (v.omi.medio ?? (v.omi.min && v.omi.max ? (v.omi.min + v.omi.max) / 2 : null)) : null;
  let valMq = null;
  if (compAdj != null && omiMid != null) { const w = comps.length >= 3 ? par(im, "peso_comparabili") : 0.4; valMq = w * compAdj + (1 - w) * omiMid; }
  else valMq = compAdj ?? omiMid;
  if (v.valore_mq_manuale) valMq = v.valore_mq_manuale;
  const valore = valMq && im.mq ? valMq * im.mq : null;
  const offMax = valore ? Math.min(im.prezzo, valore) : im.prezzo;
  return { comps, compMq, compAdj, omiMid, valMq, valore, offMax, offMin: offMax * 0.92,
           sconto: valore ? (valore - im.prezzo) / valore : null, prezzoMq: im.mq ? im.prezzo / im.mq : null };
}
function scenari(im, val) {
  const a = im.affitti || {}, out = {};
  const acquisto = val.offMax, costiAcq = acquisto * par(im, "costi_acquisto_pct");
  const lavori = im.lavori || 0;
  const arredo = im.arredo != null ? im.arredo : (im.arredato ? 0 : par(im, "arredo_se_non_arredato"));
  const cond = (im.spese?.condominio_mese || 0) * 12, imu = im.spese?.imu_anno || 0;
  const ced = a.breve?.cedolare ?? par(im, "tasse.cedolare"), soc = par(im, "tasse.societa");
  const chiudi = (k, lordo, costi, invest, extra) => {
    const tot = costi.reduce((s, c) => s + c[1], 0), ante = lordo - tot;
    const cedK = k === "lungo" && a.lungo?.concordato ? 0.10 : (a[k]?.cedolare ?? par(im, "tasse.cedolare"));
    const priv = ante - lordo * cedK, srl = ante - Math.max(0, ante) * soc;
    const netto = TAX === "srl" ? srl : priv;
    return Object.assign({ k, lordo, costi, totCosti: tot, ante, tasse: TAX === "srl" ? Math.max(0, ante) * soc : lordo * cedK,
      aliquota: TAX === "srl" ? soc : cedK, netto, nettoPriv: priv, nettoSrl: srl, invest,
      rendLordo: lordo / acquisto, rendNetto: netto / invest, payback: netto > 0 ? invest / netto : null,
      stima: !!a[k]?.stima, fonte: a[k]?.fonte }, extra || {});
  };
  if (a.breve && a.breve.adr && a.breve.occ) {
    const b = a.breve, notti = 365 * b.occ, lordo = b.adr * notti, P = k => par(im, "breve." + k);
    const sogg = notti / P("soggiorno_medio_notti");
    out.breve = chiudi("breve", lordo, [
      ["Commissioni Airbnb/Booking", lordo * P("commissioni_pct")],
      ["Gestione locale (co-host)", lordo * P("gestione_pct")],
      ["Pulizie e biancheria", sogg * P("pulizia_per_soggiorno")],
      ["Utenze e internet", P("utenze_anno")],
      ["Manutenzione e consumabili", lordo * P("manutenzione_pct")],
      ["Condominio", cond], ["IMU", imu], ["Assicurazione", P("assicurazione_anno")]
    ], acquisto + costiAcq + lavori + arredo, { notti, adr: b.adr, occ: b.occ });
  }
  if (a.medio && a.medio.canone) {
    const m = a.medio, mesi = m.mesi_occupati ?? 10, lordo = m.canone * mesi, P = k => par(im, "medio." + k);
    out.medio = chiudi("medio", lordo, [
      ["Commissioni portali/agenzia", lordo * P("commissioni_pct")],
      ["Utenze (incluse nel canone)", P("utenze_anno")],
      ["Manutenzione", lordo * P("manutenzione_pct")],
      ["Condominio", cond], ["IMU", imu], ["Assicurazione", P("assicurazione_anno")]
    ], acquisto + costiAcq + lavori + arredo, { canone: m.canone, mesi });
  }
  if (a.lungo && a.lungo.canone) {
    const l = a.lungo, P = k => par(im, "lungo." + k), mesi = P("mesi_incassati"), lordo = l.canone * mesi;
    out.lungo = chiudi("lungo", lordo, [
      ["Condominio (quota proprietario)", cond * P("condominio_proprietario_pct")],
      ["IMU", imu], ["Manutenzione", lordo * P("manutenzione_pct")], ["Assicurazione", P("assicurazione_anno")]
    ], acquisto + costiAcq + lavori, { canone: l.canone, mesi });
  }
  return { list: out, acquisto, costiAcq, lavori, arredo };
}
const AFFID = { "buono": 100, "ottimo": 100, "da rinfrescare": 75, "da ristrutturare": 35 };
function analizza(im, cat) {
  const val = valuta(im), sc = scenari(im, val), S = IMPOSTAZIONI.punteggio;
  const keys = Object.keys(sc.list);
  let best = null;
  for (const k of keys) if (!best || sc.list[k].rendNetto > sc.list[best].rendNetto) best = k;
  const use = cat && cat !== "tutte" ? (sc.list[cat] ? cat : null) : best;
  const r = use ? sc.list[use].rendNetto : null;
  const sRend = r == null ? 0 : clamp((r - S.rend_zero) / (S.rend_top - S.rend_zero)) * 100;
  const sPrez = val.sconto == null ? 50 : clamp((val.sconto - S.sconto_zero) / (S.sconto_top - S.sconto_zero)) * 100;
  let sAff = AFFID[(im.stato || "").toLowerCase()] ?? 70;
  if (use && sc.list[use].stima) sAff -= 15;
  if (val.valore == null) sAff -= 20;
  sAff = clamp(sAff, 0, 100);
  const score = use ? Math.round(S.pesi.rendimento * sRend + S.pesi.prezzo * sPrez + S.pesi.affidabilita * sAff) : null;
  return { im, val, sc, best, use, rend: r, score, parts: { sRend, sPrez, sAff } };
}
function stato(score) {
  if (score == null) return { c: "", t: "Dati mancanti", col: "#8a8270" };
  if (score >= 70) return { c: "s-good", t: "Affare", col: "#22c55e" };
  if (score >= 50) return { c: "s-warn", t: "Da valutare", col: "#f59e0b" };
  return { c: "s-bad", t: "Debole", col: "#ef4444" };
}

/* ============ dati ============ */
const SRC = { miei: () => MIEI, auto: () => AUTO };
const findIm = (src, id) => (SRC[src] ? SRC[src]() : []).find(x => x.id === id);
const oggi = new Date().toISOString().slice(0, 10);

/* ============ componenti ============ */
function cardIm(A, src, rank) {
  const im = A.im, st = stato(A.score);
  const r = A.use ? A.sc.list[A.use] : null;
  return `<a class="im" href="#imm/${src}/${encodeURIComponent(im.id)}">
    ${win(im, st.col, `<span class="pill" style="--pc:${st.col}">${A.score ?? "—"}</span>`)}
    ${rank ? `<span class="rank">${rank}</span>` : ""}
    <div class="imt">
      <div class="loc">${esc([im.comune, im.zona].filter(Boolean).join(" · "))}</div>
      <h3>${esc(im.titolo || "Immobile")}</h3>
      <div class="meta"><b>${eur(im.prezzo)}</b> · ${num(im.mq)} m² · ${eur(A.val.prezzoMq)}/m²</div>
      <div class="meta">Netto <b>${pct(A.rend)}</b>${A.val.sconto != null ? ` · ${A.val.sconto >= 0 ? "sotto" : "sopra"} mercato <b>${pct(Math.abs(A.val.sconto), 0)}</b>` : ""}</div>
      <div class="tags"><span class="tag st ${st.c}">${st.t}</span>${A.use ? `<span class="tag cat">${CATS[A.use]}</span>` : ""}${r && r.stima ? `<span class="tag est">stima</span>` : ""}${src === "auto" && im.trovato === oggi ? `<span class="tag new">nuovo oggi</span>` : ""}${src === "auto" && im.promosso ? "" : ""}</div>
    </div>
  </a>`;
}
function win(im, col, pill) {
  return `<div class="win" style="--wc:${col}">${window.artSvg ? artSvg(im) : `<span class="ini">${esc((im.comune || "?")[0])}</span>`}${im.foto ? `<img src="${esc(im.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : `<span class="artlab">illustrazione</span>`}${pill || ""}</div>`;
}
let maps = [];
function drawMap(el, points, opts = {}) {
  if (!window.L) { el.innerHTML = `<div class="mapfb">Mappa non disponibile senza connessione.</div>`; return; }
  const m = L.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false });
  L.control.zoom({ position: "bottomright" }).addTo(m);
  const osm = L.tileLayer("https://tile.openstreetmap.org/{z}/{x}/{y}.png", { maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(m);
  if (window.plLeaflet) plLeaflet(m, osm);
  const b = [];
  for (const p of points) {
    if (p.lat == null || p.lng == null) continue;
    const mk = L.circleMarker([p.lat, p.lng], { radius: p.r || 9, color: "#070707", weight: 2, fillColor: p.col, fillOpacity: p.op ?? 1, className: "mk" }).addTo(m);
    if (p.html) mk.bindPopup(p.html);
    if (p.tip) mk.bindTooltip(p.tip, { direction: "top" });
    b.push([p.lat, p.lng]);
  }
  if (b.length > 1) m.fitBounds(b, { padding: [36, 36], maxZoom: opts.maxZoom || 14 });
  else if (b.length === 1) m.setView(b[0], opts.zoom || 13);
  else m.setView([42.3, 12.6], 5);
  maps.push(m);
  setTimeout(() => m.invalidateSize(), 60);
}
function emptyBox(t, p) { return `<div class="empty"><b>${t}</b>${p}</div>`; }

/* ============ viste ============ */
function vHome() {
  const all = [...MIEI.map(im => ({ A: analizza(im), src: "miei" })), ...AUTO.map(im => ({ A: analizza(im), src: "auto" }))];
  const ok = all.filter(x => x.A.score != null).sort((a, b) => b.A.score - a.A.score);
  const bestRend = ok.reduce((m, x) => !m || x.A.rend > m.A.rend ? x : m, null);
  const affari = ok.filter(x => x.A.score >= 70).length;
  const cat = store.get("homecat", "breve");
  const perCat = all.map(x => ({ ...x, A: analizza(x.A.im, cat) })).filter(x => x.A.score != null).sort((a, b) => b.A.score - a.A.score).slice(0, 3);
  const news = [...NOTIZIE].sort((a, b) => (b.data || "").localeCompare(a.data || "")).slice(0, 3);
  return `
  <h1>Migliori investimenti</h1>
  <p class="sub">Classifica di tutti gli immobili analizzati · tasse: ${TAX === "srl" ? "società (SRL)" : "persona fisica (cedolare)"}</p>
  <div class="kpis">
    <div class="kpi"><small>Analizzati</small><b>${all.length}</b><span>${MIEI.length} miei · ${AUTO.length} auto</span></div>
    <div class="kpi"><small>Miglior netto</small><b class="cy">${bestRend ? pct(bestRend.A.rend) : "—"}</b><span>${bestRend ? esc(bestRend.A.im.comune) : "nessun dato"}</span></div>
    <div class="kpi"><small>Affari</small><b>${affari}</b><span>punteggio 70+</span></div>
  </div>
  <h2>Classifica generale <small>Top 5</small></h2>
  ${ok.length ? `<div class="list">${ok.slice(0, 5).map((x, i) => cardIm(x.A, x.src, i + 1)).join("")}</div>`
    : emptyBox("Ancora nessun immobile", `<p>Manda a Claude i link degli annunci che stai osservando: li analizza e li carica qui con comparabili, valore e business plan.</p>`)}
  <h2>I migliori per uso</h2>
  <div class="chips" id="homecat">${Object.keys(CAT).map(k => `<button class="chip ${k === cat ? "on" : ""}" data-c="${k}">${CAT[k]}</button>`).join("")}</div>
  <div class="list" style="margin-top:10px">${perCat.length ? perCat.map((x, i) => cardIm(x.A, x.src, i + 1)).join("") : `<p class="sub">Nessun immobile con dati per questo uso.</p>`}</div>
  <h2>Analisi del territorio</h2>
  <div class="tgrid">
    <a class="tcard" href="#brevi"><b>Mappa B&amp;B</b><span>Prezzo a notte, occupazione e rendita di ${TERR.brevi.length} località</span></a>
    <a class="tcard" href="#valuta"><b>Valutazione</b><span>${TERR.comuni.length.toLocaleString("it-IT")} comuni e un valutatore per qualsiasi casa</span></a>
    <a class="tcard" href="#milano"><b>Milano</b><span>${TERR.milano.zone.length} zone con metro, università e ospedali</span></a>
  </div>
  <h2>Ultime notizie <small><a href="#notizie">Tutte</a></small></h2>
  ${news.length ? `<div class="list">${news.map(cardNews).join("")}</div>` : `<p class="sub">Le notizie arriveranno ogni mattina alle 10.</p>`}
  <h2>Dalla guida <small><a href="#guida">Tutta la guida</a></small></h2>
  <div class="list">${GUIDA.slice(0, 2).map(cardGuida).join("")}</div>`;
}
function afterHome() {
  $("#homecat")?.addEventListener("click", e => { const c = e.target.closest("[data-c]"); if (!c) return; store.set("homecat", c.dataset.c); render(); });
}

function vLista(src) {
  const data = SRC[src](), f = store.get("f_" + src, { cat: "tutte", reg: "", com: "", sort: "score", zona: false });
  const regs = [...new Set(data.map(x => x.regione).filter(Boolean))].sort();
  const coms = [...new Set(data.filter(x => !f.reg || x.regione === f.reg).map(x => x.comune).filter(Boolean))].sort();
  let rows = data.filter(x => (!f.reg || x.regione === f.reg) && (!f.com || x.comune === f.com)).map(im => analizza(im, f.cat));
  if (f.cat !== "tutte") rows = rows.filter(A => A.use);
  const sorters = { score: (a, b) => (b.score ?? -1) - (a.score ?? -1), rend: (a, b) => (b.rend ?? -9) - (a.rend ?? -9),
    prezzo: (a, b) => a.im.prezzo - b.im.prezzo, sconto: (a, b) => (b.val.sconto ?? -9) - (a.val.sconto ?? -9),
    nuovi: (a, b) => (b.im.trovato || b.im.aggiunto || "").localeCompare(a.im.trovato || a.im.aggiunto || "") };
  rows.sort(sorters[f.sort] || sorters.score);
  const title = src === "miei" ? "I miei immobili" : "Ricerca automatica";
  const sub = src === "miei" ? "Gli annunci che hai mandato tu, analizzati uno per uno" : "Immobili trovati ogni giorno dalle notifiche email";
  let body;
  if (!data.length) {
    body = src === "miei"
      ? emptyBox("Archivio vuoto", `<p>Manda a Claude il link di un annuncio o di una pagina di ricerca di Immobiliare: ogni immobile comparirà qui sulla mappa con la sua scheda.</p>`)
      : emptyBox("In arrivo", `<p>Questa sezione si riempirà da sola quando collegheremo le notifiche di Immobiliare e Idealista.</p><p>Intanto usa <a href="#miei">I miei immobili</a>.</p>`);
  } else if (f.zona) {
    const g = {};
    rows.forEach(A => (g[A.im.comune || "Senza zona"] ||= []).push(A));
    const zs = Object.entries(g).sort((a, b) => (b[1][0].score ?? -1) - (a[1][0].score ?? -1));
    body = zs.map(([z, L]) => `<div class="zhead">${esc(z)} <span>${L.length} immobil${L.length === 1 ? "e" : "i"} · migliore ${L[0].score ?? "—"}</span></div>
      <div class="list grid2">${L.map((A, i) => cardIm(A, src, i + 1)).join("")}</div>`).join("");
  } else body = rows.length ? `<div class="list grid2">${rows.map((A, i) => cardIm(A, src, f.sort === "score" || f.sort === "rend" ? i + 1 : 0)).join("")}</div>` : `<p class="sub">Nessun immobile con questi filtri.</p>`;
  return `<h1>${title}</h1><p class="sub">${sub}</p>
  ${data.length ? `<div class="filters" id="filters">
    <div class="chips">${[["tutte", "Tutte"], ...Object.entries(CAT)].map(([k, t]) => `<button class="chip ${f.cat === k ? "on" : ""}" data-cat="${k}">${t}</button>`).join("")}</div>
    <div class="selrow">
      <select data-f="reg"><option value="">Tutte le regioni</option>${regs.map(r => `<option ${r === f.reg ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>
      <select data-f="com"><option value="">Tutti i comuni</option>${coms.map(r => `<option ${r === f.com ? "selected" : ""}>${esc(r)}</option>`).join("")}</select>

function vbar(im, V) {
  const o = im.valutazione?.omi;
  const vals = [V.prezzoMq, V.valMq, V.compMq, o?.min, o?.max, o?.medio, ...V.comps.map(c => c.prezzo / c.mq)].filter(x => x != null && isFinite(x));
  if (vals.length < 2) return "";
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.12 || hi * 0.1; lo -= pad; hi += pad;
  const W = 360, X = v => 40 + (v - lo) / (hi - lo) * (W - 80), y = 44;
  let s = `<svg viewBox="0 0 ${W} 100" role="img" aria-label="Prezzo al metro quadro rispetto al mercato">`;
  s += `<line x1="30" x2="${W - 30}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-linecap="round"/>`;
  if (o?.min && o?.max) s += `<rect x="${X(o.min)}" y="${y - 9}" width="${Math.max(2, X(o.max) - X(o.min))}" height="18" rx="4" fill="rgba(201,162,39,.18)" stroke="rgba(242,207,91,.35)"/>`;
  if (o?.medio && !(o?.min && o?.max)) s += `<rect x="${X(o.medio) - 3}" y="${y - 9}" width="6" height="18" rx="3" fill="rgba(201,162,39,.55)"><title>OMI ${num(o.medio)} €/m²</title></rect>`;
  for (const c of V.comps) s += `<circle cx="${X(c.prezzo / c.mq)}" cy="${y}" r="5" fill="#f5d76e" stroke="#141414" stroke-width="2"><title>${esc(c.titolo || "Comparabile")}: ${num(c.prezzo / c.mq)} €/m²</title></circle>`;
  const mark = (v, col, lab, up) => v == null ? "" : `<line x1="${X(v)}" x2="${X(v)}" y1="${y - 14}" y2="${y + 14}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><text x="${X(v)}" y="${up ? y - 32 : y + 30}" fill="#f3efe2" font-size="12" font-weight="700" text-anchor="middle" font-family="Barlow,sans-serif">${lab}</text><text x="${X(v)}" y="${up ? y - 18 : y + 44}" fill="#d4cdb8" font-size="11" text-anchor="middle" font-family="Barlow,sans-serif">${num(v)} €/m²</text>`;
    s += mark(V.valMq, "#f2cf5b", "Valore stimato", false);
  s += mark(V.prezzoMq, "#facc15", "Prezzo chiesto", true);
  s += `</svg>`;
  return `<div class="vbar">${s}</div><div class="legend"><span><i style="background:#facc15;color:#facc15"></i>Prezzo chiesto</span><span><i style="background:#f2cf5b;color:#f2cf5b"></i>Valore stimato</span>${im.valutazione?.omi?.min ? `<span><i style="background:rgba(201,162,39,.35);border-radius:3px;color:transparent"></i>Forbice OMI</span>` : im.valutazione?.omi?.medio ? `<span><i style="background:rgba(201,162,39,.55);border-radius:3px;color:transparent"></i>Valore OMI</span>` : ""}${V.comps.length ? `<span><i style="background:#f5d76e;color:#f5d76e"></i>Comparabili</span>` : ""}</div>`;
}
function season(m) {
  const W = 360, H = 150, b = 22, top = 18, ch = H - b - top, bw = (W - 20) / 12;
  const mx = Math.max(...m), mn = Math.min(...m);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Occupazione per mese">`;
  [0.25, 0.5, 0.75, 1].forEach(t => s += `<line x1="10" x2="${W - 10}" y1="${top + ch * (1 - t)}" y2="${top + ch * (1 - t)}" stroke="rgba(255,255,255,.06)"/>`);
  m.forEach((v, i) => {
    const h = Math.max(3, ch * v), x = 10 + i * bw + 3, y = top + ch - h, w = bw - 6;
    s += `<path class="bar" data-tip="${MESI[i]}: ${pct(v, 0)}" d="M${x},${top + ch} V${y + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${top + ch} Z" fill="${v >= 0.7 ? "#f2cf5b" : v >= 0.45 ? "#a8861c" : "#4a3a0e"}"/>`;
    s += `<rect x="${10 + i * bw}" y="${top}" width="${bw}" height="${ch}" fill="transparent" data-tip="${MESI[i]}: ${pct(v, 0)}"/>`;
    s += `<text x="${x + w / 2}" y="${H - 8}" fill="#a8a08a" font-size="10" text-anchor="middle" font-family="Barlow,sans-serif">${MESI[i][0]}</text>`;
    if (v === mx || v === mn) s += `<text x="${x + w / 2}" y="${y - 5}" fill="#f3efe2" font-size="10.5" font-weight="700" text-anchor="middle" font-family="Barlow,sans-serif">${pct(v, 0)}</text>`;
  });
  return s + `</svg><div class="legend"><span><i style="background:#f2cf5b;color:#f2cf5b"></i>Alta (70%+)</span><span><i style="background:#a8861c;color:#a8861c"></i>Media</span><span><i style="background:#4a3a0e;color:transparent"></i>Bassa (sotto 45%)</span></div>`;
}

  }
  const cats = [...new Set(GUIDA.map(g => g.categoria))];
  return `<h1>Guida</h1><p class="sub">Come investire: zone, valutazione, rendimenti e aspetti pratici.</p>
    ${cats.map(c => `<h2>${esc(c)}</h2><div class="list">${GUIDA.filter(g => g.categoria === c).map(cardGuida).join("")}</div>`).join("")}`;
}
function md(t) {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return t.trim().split(/\n\s*\n/).map(b => {
    const L = b.split("\n");
    if (L[0].startsWith("## ")) { const rest = L.slice(1).join("\n"); return `<h2>${inl(L[0].slice(3))}</h2>` + (rest ? md(rest) : ""); }
    if (L.every(l => l.startsWith("- "))) return `<ul>${L.map(l => `<li>${inl(l.slice(2))}</li>`).join("")}</ul>`;
    return `<p>${inl(b)}</p>`;
  }).join("");
}


/* pulsante Espandi sotto ogni mappa (opzione A) */
function mapExpanders() {
  document.querySelectorAll("#app .map:not(.small), #app .mm3d, #app .itmap, #app .itmap2").forEach(m => {
    const after = m.closest(".mmwrap, .clmapw") || m;
    if (after.nextElementSibling?.classList.contains("mxbtn")) return;
    const b = document.createElement("button"); b.type = "button"; b.className = "mxbtn"; b.textContent = "⤢ Espandi mappa";
    b.addEventListener("click", () => { const on = m.classList.toggle("mexp"); b.textContent = on ? "⤡ Riduci mappa" : "⤢ Espandi mappa";
      const rs = () => { maps.forEach(x => { try { x.invalidateSize ? x.invalidateSize() : x.resize && x.resize(); } catch (e) {} });
        try { window.MM && MM.map && MM.map.resize(); } catch (e) {} try { if (typeof HOME_MAP !== "undefined" && HOME_MAP) (HOME_MAP.resize || HOME_MAP.invalidateSize).call(HOME_MAP); } catch (e) {} };
      setTimeout(rs, 60); setTimeout(rs, 320);
      if (!on) after.scrollIntoView({ block: "nearest", behavior: "smooth" }); });
    after.insertAdjacentElement("afterend", b);
  });
}
/* ============ router ============ */
function render(keepScroll) {
  maps.forEach(m => m.remove()); maps = [];
  if (typeof HOME_MAP !== "undefined" && HOME_MAP) { try { HOME_MAP.remove(); } catch {} HOME_MAP = null; }
  const [v, a, b, c] = (location.hash.slice(1) || "home").split("/").map(decodeURIComponent);
  if (v === "valuta") { location.replace("#inv"); return; }
  if (v === "miei" || v === "auto") { store.set("f_inv", { ...store.get("f_inv", {}), src: v }); location.replace("#inv/classifica"); return; }
  const app = $("#app"), y = window.scrollY;
  let html, after = () => {};
  if (v === "miei" || v === "auto") { html = vLista(v); after = () => afterLista(v); }
  else if (v === "imm") { html = vScheda(a, b); after = () => afterScheda(a, b); }
  else if (v === "notizie") { html = vNotizie(); after = afterNotizie; }
  else if (v === "guida") html = vGuida(a);
  else if (v === "inv") { html = vInv(a, b, c); after = () => afterInv(a, b, c); }
  else if (v === "seguiti") { html = vSeguiti(); after = afterSeguiti; }
  else if (v === "completa") { html = vCompleta(a); after = () => afterCompleta(a); }
  else if (TERR_VIEWS[v]) { html = TERR_VIEWS[v][0](a, b, c); after = () => TERR_VIEWS[v][1](a, b, c); }
  else { html = vHomeK(); after = afterHomeK; }
  const INVK = { miei: "archivio", auto: "auto", brevi: "dove" };
  if (INVK[v] && window.invBread) html = invBread(INVK[v]) + html;
  if (v && v !== "home") html = `<button class="pgback" id="pgback" aria-label="Indietro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>Indietro</button>` + html;
  app.innerHTML = html; after(); try { mapExpanders(); } catch (e) {}
  const navv = v === "imm" || INVK[v] ? "inv" : v || "home";
  document.querySelectorAll("#nav a").forEach(x => { const on = x.dataset.v === navv; x.classList.toggle("on", on); if (on) x.scrollIntoView({ inline: "nearest", block: "nearest" }); });
  hhSet();
  window.scrollTo(0, keepScroll ? y : 0);
}
/* come Dreamers: tornando indietro si ritorna allo stesso punto della pagina (es. all'annuncio aperto) */
const POS = (() => { try { return JSON.parse(sessionStorage.getItem("ks_pos") || "{}"); } catch { return {}; } })();
let STACK = (() => { try { return JSON.parse(sessionStorage.getItem("ks_stack") || "[]"); } catch { return []; } })();
const curH = () => location.hash.slice(1) || "home";
let lastH = curH(), tPos;
window.addEventListener("scroll", () => { clearTimeout(tPos); const h = curH(), y = window.scrollY; tPos = setTimeout(() => { POS[h] = y; try { sessionStorage.setItem("ks_pos", JSON.stringify(POS)); } catch {} }, 120); }, { passive: true });
window.addEventListener("hashchange", () => {
  const h = curH(), back = STACK.length >= 2 && STACK[STACK.length - 2] === h;
  if (back) STACK.pop(); else { if (STACK[STACK.length - 1] !== lastH) STACK.push(lastH); STACK.push(h); }
  STACK = STACK.slice(-60); lastH = h; try { sessionStorage.setItem("ks_stack", JSON.stringify(STACK)); } catch {}
  render();
  if (back && POS[h] > 0) { const y = POS[h], go = () => window.scrollTo(0, y); go(); requestAnimationFrame(go); setTimeout(go, 250); setTimeout(go, 800); }
});
if (!STACK.length) STACK = [curH()];

/* tooltip dei grafici */
const tip = $("#tip");
["pointermove","pointerdown"].forEach(ev => document.addEventListener(ev, e => { const t = e.target.closest?.("[data-tip]"); if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY - 34) + "px"; }));
/* tasto indietro come in Dreamers: torna alla pagina precedente dell'app, o al livello superiore */
const PARENT = h => { const [v, a, b, c] = h.split("/"); if (v === "imm") return "inv/classifica"; if (["miei", "auto", "brevi"].includes(v)) return a ? v : "inv";
  if (v === "inv") return "home"; if (v === "milano") return c ? [v, a, b].join("/") : b ? [v, a].join("/") : a ? v : "home"; return "home"; };
let NAVN = +(sessionStorage.getItem("ks_n") || 0);
window.addEventListener("hashchange", () => { NAVN++; try { sessionStorage.setItem("ks_n", NAVN); } catch {} });
document.addEventListener("click", e => { if (!e.target.closest("#pgback")) return; const h = location.hash.slice(1) || "home"; if (NAVN > 0) { NAVN -= 2; history.back(); } else location.hash = PARENT(h); });
const hhSet = () => document.documentElement.style.setProperty("--hh", $(".top").offsetHeight + "px");
window.addEventListener("resize", hhSet);
/* stile unico: Notte morbida */
if (window.plSet) plSet();
/* il logo ricarica i dati restando nella stessa pagina e allo stesso punto */
$("#logo").addEventListener("click", e => { e.preventDefault(); $("#logo").classList.add("ruota"); try { sessionStorage.setItem("ks_y", String(window.scrollY)); } catch {} setTimeout(() => location.reload(), 650); });
render();
try { const y = sessionStorage.getItem("ks_y"); if (y != null) { sessionStorage.removeItem("ks_y"); const go = () => window.scrollTo(0, +y); go(); setTimeout(go, 400); setTimeout(go, 1200); } } catch {}
</script>
