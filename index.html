<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Invest17</title>
<meta name="description" content="Analisi di immobili da mettere a reddito: valore, comparabili, rendimenti e notizie">
<meta name="theme-color" content="#04070d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Invest17">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:ital,wght@0,600;0,700;1,700;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<style>
/* ===== Stile CYBER (preso da Dreamers): nero con ciano e magenta, vetro con riflessi ===== */
:root{
  --bg:#04070d;--panel:#0a1220;--panel2:#101c33;--line:#1c3a63;--line2:rgba(125,243,255,.14);
  --tx:#e6f7ff;--tx2:#b3cde4;--muted:#8fb0d0;
  --cy:#00c8e0;--cy2:#7df3ff;--mg:#ff2bd6;--yl:#facc15;--on:#001018;
  --hd1:#0a1a33;--hd2:#040a14;
  --good:#22c55e;--warn:#f59e0b;--bad:#ef4444;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;min-height:100vh;color:var(--tx);font-family:var(--body);font-size:15px;line-height:1.45;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 30px);
  background:radial-gradient(900px 500px at 85% -10%,rgba(0,200,224,.10),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(255,43,214,.06),transparent 60%),linear-gradient(180deg,#060b16,var(--bg) 40%)}
a{color:var(--cy2)}
button{font-family:inherit}
[hidden]{display:none!important}
img{max-width:100%}

/* ---- intestazione: vetro con riflesso ---- */
.top{position:sticky;top:0;z-index:900;background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 45%),linear-gradient(180deg,var(--hd1),var(--hd2));
  box-shadow:0 3px 0 var(--cy),0 6px 18px rgba(0,200,224,.35);padding-top:env(safe-area-inset-top,0px)}
.toprow{display:flex;align-items:center;gap:12px;padding:12px 16px 8px}
.logo{display:flex;align-items:center;gap:12px;text-decoration:none;color:#fff}
.logo i{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;font-size:22px;color:var(--on);
  background:linear-gradient(180deg,var(--cy2),var(--cy));box-shadow:0 0 18px rgba(0,200,224,.55),inset 0 1px 0 rgba(255,255,255,.6),inset 0 -3px 0 rgba(0,0,0,.18);position:relative;overflow:hidden}
.logo i::after{content:"";position:absolute;inset:0 0 50% 0;background:linear-gradient(180deg,rgba(255,255,255,.45),rgba(255,255,255,0));border-radius:12px 12px 40% 40%}
.logo b{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;letter-spacing:.03em;text-transform:uppercase;text-shadow:0 2px 0 rgba(0,0,0,.4)}
.top .sp{flex:1}
.taxsw{display:flex;background:rgba(0,0,0,.35);border:1px solid var(--line);border-radius:999px;padding:3px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.taxsw button{border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:6px 10px;border-radius:999px;cursor:pointer}
.taxsw button.on{background:linear-gradient(180deg,var(--cy2),var(--cy));color:var(--on);box-shadow:0 0 10px rgba(0,200,224,.5)}

/* ---- barra di navigazione a schede inclinate ---- */
.nav{display:flex;gap:6px;overflow-x:auto;padding:4px 16px 0;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nav a{flex:none;display:flex;align-items:center;gap:7px;padding:9px 18px 10px;text-decoration:none;color:var(--muted);transform:skewX(-14deg);
  background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.01));border-radius:6px 6px 0 0;
  font-family:var(--display);font-style:italic;font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.nav a>*{transform:skewX(14deg)}
.nav a svg{width:17px;height:17px;flex:none}
.nav a.on{background:linear-gradient(180deg,var(--cy2),var(--cy));color:var(--on);box-shadow:0 0 16px rgba(0,200,224,.45)}

main{max-width:980px;margin:0 auto;padding:18px 14px 0}
h1,h2,h3{font-family:var(--display);font-style:italic;font-weight:800;text-transform:uppercase;margin:0}
h1{font-size:30px;line-height:1.02;letter-spacing:.03em;text-shadow:0 0 22px rgba(0,200,224,.25)}
h2{font-size:17px;letter-spacing:.14em;color:var(--mg);margin:26px 0 10px;display:flex;align-items:center;gap:8px;text-shadow:0 0 14px rgba(255,43,214,.35)}
h2 small{font-family:var(--display);font-style:italic;font-weight:700;text-transform:uppercase;letter-spacing:.1em;font-size:13px;color:var(--muted);margin-left:auto;text-shadow:none}
h2 small a{color:var(--cy2);text-decoration:none}
.sub{color:var(--muted);font-size:13.5px;margin:6px 0 0}

/* ---- pannelli ---- */
.card{position:relative;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,0) 40%),linear-gradient(180deg,#0d1830,#070e1c);border:1px solid var(--line);border-radius:22px;padding:14px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 26px rgba(0,0,0,.35)}
.card.neon{border-top:2px solid var(--mg);border-bottom:2px solid var(--mg);box-shadow:0 0 18px rgba(255,43,214,.18),inset 0 1px 0 rgba(255,255,255,.06)}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:16px}
.kpi{position:relative;overflow:hidden;background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 50%),var(--panel2);border:1px solid var(--line);border-radius:16px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.08)}
.kpi small{display:block;font-family:var(--display);font-style:italic;font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kpi b{font-family:var(--display);font-style:italic;font-weight:800;font-size:30px;font-variant-numeric:tabular-nums;line-height:1.1;color:#fff}
.kpi b.cy{color:var(--cy2);text-shadow:0 0 14px rgba(0,200,224,.5)}
.kpi span{display:block;font-size:11.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.empty{border:1px dashed rgba(125,243,255,.25);border-radius:22px;padding:24px 16px;text-align:center;color:var(--tx2);background:rgba(10,18,32,.6)}
.empty b{display:block;font-family:var(--display);font-style:italic;font-size:22px;letter-spacing:.06em;text-transform:uppercase;color:var(--cy2);margin-bottom:6px}
.empty p{margin:6px 0 0;font-size:13.5px}

/* ---- chip e filtri ---- */
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0)),var(--panel);color:var(--tx2);border-radius:999px;padding:8px 14px;font-family:var(--display);font-style:italic;font-weight:700;font-size:15px;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;white-space:nowrap}
.chip.on{background:linear-gradient(180deg,var(--cy2),var(--cy));border-color:var(--cy2);color:var(--on);box-shadow:0 0 12px rgba(0,200,224,.45)}
.filters{display:grid;gap:9px;margin:14px 0}
.selrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
select{width:100%;background:var(--panel);color:var(--tx);border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:13px;font-family:inherit;box-shadow:inset 0 1px 3px rgba(0,0,0,.4)}
.tog{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--tx2);cursor:pointer;user-select:none}
.tog input{accent-color:var(--cy);width:16px;height:16px}

/* ---- finestra (foto con vetro e riflesso, come i loghi di Dreamers) ---- */
.win{--wc:var(--cy);position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(160deg,color-mix(in srgb,var(--wc) 55%,#0a1220),#060b16);background-size:cover;background-position:center;
  border:1.5px solid color-mix(in srgb,var(--wc) 70%,#fff 10%);border-bottom:4px solid color-mix(in srgb,var(--wc) 45%,#000);
  box-shadow:0 0 18px color-mix(in srgb,var(--wc) 45%,transparent),0 10px 20px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.35)}
.win::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.34),rgba(255,255,255,.06) 38%,rgba(255,255,255,0) 50%),linear-gradient(115deg,transparent 55%,rgba(255,255,255,.12) 62%,transparent 70%);pointer-events:none;z-index:1}
.win::after{content:"";position:absolute;inset:0;box-shadow:inset 0 -18px 26px rgba(0,0,0,.45);pointer-events:none;z-index:1}
.win .ini{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-style:italic;font-weight:800;font-size:38px;color:rgba(255,255,255,.85);text-shadow:0 2px 6px rgba(0,0,0,.5)}
.win img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ---- card immobile ---- */
.list{display:grid;gap:12px}
.im{display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px;align-items:start;text-decoration:none;color:var(--tx);position:relative;padding:12px;border-radius:22px;
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 40%),linear-gradient(180deg,#0d1830,#070e1c);border:1px solid var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05),0 8px 20px rgba(0,0,0,.3);transition:transform .12s,border-color .12s,box-shadow .12s}
.im:active{transform:scale(.985)}
.im:hover{border-color:rgba(125,243,255,.45);box-shadow:0 0 18px rgba(0,200,224,.2)}
.im .win{width:104px;height:104px}
.rank{position:absolute;top:-7px;left:-7px;width:28px;height:28px;border-radius:9px;background:linear-gradient(180deg,#fde047,var(--yl));color:#1a1300;font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;display:grid;place-items:center;z-index:3;box-shadow:0 0 12px rgba(250,204,21,.55),inset 0 1px 0 rgba(255,255,255,.6)}
.imt{min-width:0;display:flex;flex-direction:column;gap:4px}
.loc{font-family:var(--display);font-style:italic;font-weight:700;font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--mg);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.imt h3{font-family:var(--body);font-style:normal;text-transform:none;letter-spacing:0;font-weight:700;font-size:15px;line-height:1.25;color:#fff;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{font-size:13px;color:var(--tx2);font-variant-numeric:tabular-nums}
.meta b{color:#fff}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:3px}
.tag{font-family:var(--display);font-style:italic;font-size:12.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 9px;border-radius:7px;border:1px solid var(--line);background:rgba(0,0,0,.25);color:var(--tx2)}
.tag.cat{border-color:rgba(125,243,255,.45);color:var(--cy2)}
.tag.new{background:var(--yl);border-color:var(--yl);color:#1a1300}
.tag.est{border-color:rgba(245,158,11,.5);color:#fbbf55}
.win .pill{position:absolute;right:6px;bottom:6px;z-index:2;font-size:19px;padding:2px 8px 1px}
.pill{display:inline-block;font-family:var(--display);font-style:italic;font-weight:800;font-size:22px;font-variant-numeric:tabular-nums;padding:3px 10px 2px;border-radius:9px;color:#fff;
  background:linear-gradient(180deg,rgba(255,255,255,.25),rgba(255,255,255,0) 55%),var(--pc,#5b6b95);box-shadow:0 0 12px color-mix(in srgb,var(--pc,#5b6b95) 55%,transparent),inset 0 -2px 0 rgba(0,0,0,.2)}
.tag.st{border-color:currentColor}
.s-good{color:var(--good)}.s-warn{color:var(--warn)}.s-bad{color:var(--bad)}
.zhead{display:flex;align-items:baseline;gap:8px;margin:18px 0 10px;font-family:var(--display);font-style:italic;font-weight:800;font-size:19px;letter-spacing:.08em;text-transform:uppercase;color:var(--cy2)}
.zhead span{font-family:var(--body);font-style:normal;font-weight:500;font-size:12px;text-transform:none;letter-spacing:0;color:var(--muted)}

/* ---- mappa ---- */
.map{height:44vh;min-height:260px;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:#060b16;position:relative;box-shadow:0 0 0 1px rgba(0,200,224,.12),0 0 24px rgba(0,200,224,.15)}
.map.small{height:240px;min-height:0;border-radius:16px}
.mapfb{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);font-size:13px;padding:20px}
.leaflet-container{background:#060b16;font-family:var(--body)}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:#101c33;color:var(--tx);border:1px solid var(--line);box-shadow:0 0 18px rgba(0,200,224,.3)}
.leaflet-popup-content{margin:10px 12px;font-size:13px}
.leaflet-popup-content a.go{display:inline-block;margin-top:6px;font-weight:700;color:var(--cy2)}
.leaflet-control-attribution{background:rgba(4,7,13,.7)!important;color:var(--muted)!important}
.leaflet-control-attribution a{color:var(--tx2)!important}
.leaflet-bar a{background:#101c33!important;color:var(--cy2)!important;border-color:var(--line)!important}
.mk{filter:drop-shadow(0 0 6px currentColor)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--tx2);margin:9px 2px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px;box-shadow:0 0 6px currentColor}

/* ---- scheda ---- */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--cy2);text-decoration:none;font-family:var(--display);font-style:italic;font-weight:800;font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
.hero{display:grid;gap:14px}
.hero .win{height:230px;border-radius:24px}
.hero .win .ini{font-size:70px}
.hero h1{font-size:27px}
.price{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap;margin-top:10px}
.price b{font-family:var(--display);font-style:italic;font-weight:800;font-size:38px;color:var(--yl);font-variant-numeric:tabular-nums;line-height:1;text-shadow:0 0 18px rgba(250,204,21,.35)}
.price span{color:var(--tx2);font-size:13px}
.verdict{display:flex;align-items:center;gap:12px;margin-top:12px;padding:11px 12px;border-radius:16px;background:rgba(0,0,0,.3);border:1px solid var(--line)}
.verdict .pill{font-size:30px;padding:4px 12px 3px}
.verdict p{margin:0;font-size:13.5px;color:var(--tx2)}
.verdict p b{color:#fff}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:12px}
.fact{background:linear-gradient(180deg,rgba(255,255,255,.07),rgba(255,255,255,0) 55%),var(--panel2);border:1.5px solid rgba(139,92,246,.45);border-radius:11px;padding:6px 9px;text-align:center}
.fact small{display:block;font-family:var(--display);font-style:italic;font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.fact b{font-size:14px;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border-radius:14px;padding:11px 16px;font-family:var(--display);font-style:italic;font-weight:800;font-size:17px;letter-spacing:.06em;text-transform:uppercase;text-decoration:none;border:0;cursor:pointer}
.btn.pri{background:linear-gradient(180deg,var(--cy2),var(--cy));color:var(--on);box-shadow:0 0 16px rgba(0,200,224,.45),inset 0 1px 0 rgba(255,255,255,.5)}
.btns{display:flex;gap:10px;margin-top:12px;flex-wrap:wrap;align-items:center}

.offer{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.offer div{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 55%),var(--panel2);border:1px solid var(--line);border-radius:14px;padding:9px 10px}
.offer small{display:block;font-family:var(--display);font-style:italic;font-weight:700;font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.offer b{font-family:var(--display);font-style:italic;font-weight:800;font-size:21px;font-variant-numeric:tabular-nums;color:#fff}
.offer b.cy{color:var(--cy2)}
.offer em{display:block;font-style:normal;font-size:11.5px;color:var(--tx2)}
.vbar{margin:16px 4px 6px}
.vbar svg{width:100%;height:auto;overflow:visible}
.note{font-size:12px;color:var(--muted);margin:8px 0 0}

table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
th{text-align:left;font-family:var(--display);font-style:italic;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:6px 6px;border-bottom:1px solid var(--line)}
td{padding:8px 6px;border-bottom:1px solid rgba(28,58,99,.6);vertical-align:top}
td.r,th.r{text-align:right}
tr.me td{color:var(--yl);font-weight:700}
.tw{overflow-x:auto}

.scen{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.sc{position:relative;text-align:left;color:var(--tx);cursor:pointer;border-radius:16px;padding:10px 11px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,0) 50%),var(--panel2)}
.sc.on{border-color:var(--cy2);box-shadow:0 0 0 1px var(--cy2) inset,0 0 16px rgba(0,200,224,.35)}
.sc.best::after{content:"Migliore";position:absolute;top:-9px;right:8px;background:linear-gradient(180deg,#fde047,var(--yl));color:#1a1300;font-family:var(--display);font-style:italic;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.06em;padding:1px 8px;border-radius:6px;box-shadow:0 0 10px rgba(250,204,21,.5)}
.sc small{display:block;font-family:var(--display);font-style:italic;font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800}
.sc b{display:block;font-family:var(--display);font-style:italic;font-weight:800;font-size:28px;font-variant-numeric:tabular-nums;margin-top:2px}
.sc span{font-size:11.5px;color:var(--tx2)}
.sc.na{opacity:.45;cursor:default}
.bp{margin-top:10px}
.bp table td:first-child{color:var(--tx2)}
.bp tr.tot td{font-weight:700;color:#fff;border-bottom:0}
.bp tr.sep td{border-top:1px solid rgba(125,243,255,.3)}

.season svg{width:100%;height:auto;display:block}
.season .bar{transition:opacity .12s}
.season .bar:hover{opacity:.8}
.tip{position:fixed;z-index:2000;pointer-events:none;background:#101c33;color:var(--tx);border:1px solid var(--cy);border-radius:8px;padding:5px 8px;font-size:12px;box-shadow:0 0 14px rgba(0,200,224,.4);white-space:nowrap}

.pc{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pc ul{margin:6px 0 0;padding-left:18px;font-size:13.5px}
.pc li{margin:3px 0}
.pc h3{font-size:17px;letter-spacing:.1em}
.pc .p h3{color:var(--good)}.pc .c h3{color:#f87171}
.consiglio h3{font-size:17px;letter-spacing:.1em;color:var(--yl)}
ul.ev{margin:0;padding-left:18px;font-size:13.5px}
.src{font-size:12px;color:var(--muted)}
.src li{margin:2px 0}

/* ---- notizie e guida ---- */
.nw,.gd{display:block;text-decoration:none;color:var(--tx);border-radius:20px;padding:13px;border:1px solid var(--line);
  background:linear-gradient(180deg,rgba(255,255,255,.04),rgba(255,255,255,0) 40%),linear-gradient(180deg,#0d1830,#070e1c);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.nw .hd{display:flex;gap:7px;align-items:center;font-family:var(--display);font-style:italic;font-weight:700;font-size:13px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nw h3,.gd h3{font-family:var(--body);font-style:normal;text-transform:none;letter-spacing:0;font-size:15.5px;font-weight:700;margin:5px 0 4px;line-height:1.3;color:#fff}
.nw p,.gd p{margin:0;font-size:13.5px;color:var(--tx2)}
.nw .imp{margin-top:7px;font-size:13px;color:var(--cy2)}
.gd{border-left:3px solid var(--mg)}

<script>
"use strict";
/* ============ utilità ============ */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const eur = n => n == null || isNaN(n) ? "—" : "€\u00a0" + Math.round(n).toLocaleString("it-IT");
const keur = n => n == null || isNaN(n) ? "—" : (Math.abs(n) >= 1000 ? "€\u00a0" + (n/1000).toLocaleString("it-IT",{maximumFractionDigits:n>=100000?0:1}) + "k" : eur(n));
const pct = (n, d = 1) => n == null || isNaN(n) ? "—" : (n*100).toLocaleString("it-IT",{minimumFractionDigits:d,maximumFractionDigits:d}) + "%";
const num = (n, d = 0) => n == null || isNaN(n) ? "—" : n.toLocaleString("it-IT",{maximumFractionDigits:d});
const clamp = (x, a = 0, b = 1) => Math.max(a, Math.min(b, x));
const median = a => { if (!a.length) return null; const s = [...a].sort((x,y)=>x-y), m = s.length >> 1; return s.length % 2 ? s[m] : (s[m-1]+s[m])/2; };
const MESI = ["Gen","Feb","Mar","Apr","Mag","Giu","Lug","Ago","Set","Ott","Nov","Dic"];
const CAT = { breve:"B&B e affitto breve", medio:"Medio termine", lungo:"Affitto lungo" };
const CATS = { breve:"B&B", medio:"Medio", lungo:"Lungo" };
const store = { get(k, d) { try { const v = localStorage.getItem("i17_" + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
                set(k, v) { try { localStorage.setItem("i17_" + k, JSON.stringify(v)); } catch {} } };
let TAX = store.get("tax", "privata");

/* ============ calcoli (unica fonte per tutti i numeri) ============ */
function par(im, path) {
  const get = (o) => path.split(".").reduce((x, k) => x == null ? undefined : x[k], o);
  const v = get(im.parametri || {});
  return v !== undefined ? v : get(IMPOSTAZIONI);
}
function valuta(im) {
  const v = im.valutazione || {}, comps = (v.comparabili || []).filter(c => c.prezzo && c.mq);
  const compMq = median(comps.map(c => c.prezzo / c.mq));
  const compAdj = compMq == null ? null : compMq * (1 - par(im, "sconto_trattativa"));
  const omiMid = v.omi ? (v.omi.medio ?? (v.omi.min && v.omi.max ? (v.omi.min + v.omi.max) / 2 : null)) : null;
  let valMq = null;
  if (compAdj != null && omiMid != null) { const w = comps.length >= 3 ? par(im, "peso_comparabili") : 0.4; valMq = w * compAdj + (1 - w) * omiMid; }
  else valMq = compAdj ?? omiMid;
  if (v.valore_mq_manuale) valMq = v.valore_mq_manuale;
  const valore = valMq && im.mq ? valMq * im.mq : null;
  const offMax = valore ? Math.min(im.prezzo, valore) : im.prezzo;
  return { comps, compMq, compAdj, omiMid, valMq, valore, offMax, offMin: offMax * 0.92,
           sconto: valore ? (valore - im.prezzo) / valore : null, prezzoMq: im.mq ? im.prezzo / im.mq : null };
}
function scenari(im, val) {
  const a = im.affitti || {}, out = {};
  const acquisto = val.offMax, costiAcq = acquisto * par(im, "costi_acquisto_pct");
  const lavori = im.lavori || 0;
  const arredo = im.arredo != null ? im.arredo : (im.arredato ? 0 : par(im, "arredo_se_non_arredato"));
  const cond = (im.spese?.condominio_mese || 0) * 12, imu = im.spese?.imu_anno || 0;
  const ced = a.breve?.cedolare ?? par(im, "tasse.cedolare"), soc = par(im, "tasse.societa");
  const chiudi = (k, lordo, costi, invest, extra) => {
    const tot = costi.reduce((s, c) => s + c[1], 0), ante = lordo - tot;
    const cedK = k === "lungo" && a.lungo?.concordato ? 0.10 : (a[k]?.cedolare ?? par(im, "tasse.cedolare"));
    const priv = ante - lordo * cedK, srl = ante - Math.max(0, ante) * soc;
    const netto = TAX === "srl" ? srl : priv;
    return Object.assign({ k, lordo, costi, totCosti: tot, ante, tasse: TAX === "srl" ? Math.max(0, ante) * soc : lordo * cedK,
      aliquota: TAX === "srl" ? soc : cedK, netto, nettoPriv: priv, nettoSrl: srl, invest,
      rendLordo: lordo / acquisto, rendNetto: netto / invest, payback: netto > 0 ? invest / netto : null,
      stima: !!a[k]?.stima, fonte: a[k]?.fonte }, extra || {});
  };
  if (a.breve && a.breve.adr && a.breve.occ) {
    const b = a.breve, notti = 365 * b.occ, lordo = b.adr * notti, P = k => par(im, "breve." + k);
    const sogg = notti / P("soggiorno_medio_notti");
    out.breve = chiudi("breve", lordo, [
      ["Commissioni Airbnb/Booking", lordo * P("commissioni_pct")],
      ["Gestione locale (co-host)", lordo * P("gestione_pct")],
      ["Pulizie e biancheria", sogg * P("pulizia_per_soggiorno")],
      ["Utenze e internet", P("utenze_anno")],
      ["Manutenzione e consumabili", lordo * P("manutenzione_pct")],
      ["Condominio", cond], ["IMU", imu], ["Assicurazione", P("assicurazione_anno")]
    ], acquisto + costiAcq + lavori + arredo, { notti, adr: b.adr, occ: b.occ });
  }
  if (a.medio && a.medio.canone) {
    const m = a.medio, mesi = m.mesi_occupati ?? 10, lordo = m.canone * mesi, P = k => par(im, "medio." + k);
    out.medio = chiudi("medio", lordo, [
      ["Commissioni portali/agenzia", lordo * P("commissioni_pct")],
      ["Utenze (incluse nel canone)", P("utenze_anno")],
      ["Manutenzione", lordo * P("manutenzione_pct")],
      ["Condominio", cond], ["IMU", imu], ["Assicurazione", P("assicurazione_anno")]
    ], acquisto + costiAcq + lavori + arredo, { canone: m.canone, mesi });
  }
  if (a.lungo && a.lungo.canone) {
    const l = a.lungo, P = k => par(im, "lungo." + k), mesi = P("mesi_incassati"), lordo = l.canone * mesi;
    out.lungo = chiudi("lungo", lordo, [
      ["Condominio (quota proprietario)", cond * P("condominio_proprietario_pct")],
      ["IMU", imu], ["Manutenzione", lordo * P("manutenzione_pct")], ["Assicurazione", P("assicurazione_anno")]
    ], acquisto + costiAcq + lavori, { canone: l.canone, mesi });
  }
  return { list: out, acquisto, costiAcq, lavori, arredo };
}
const AFFID = { "buono": 100, "ottimo": 100, "da rinfrescare": 75, "da ristrutturare": 35 };
function analizza(im, cat) {
  const val = valuta(im), sc = scenari(im, val), S = IMPOSTAZIONI.punteggio;
  const keys = Object.keys(sc.list);
  let best = null;
  for (const k of keys) if (!best || sc.list[k].rendNetto > sc.list[best].rendNetto) best = k;
  const use = cat && cat !== "tutte" ? (sc.list[cat] ? cat : null) : best;
  const r = use ? sc.list[use].rendNetto : null;
  const sRend = r == null ? 0 : clamp((r - S.rend_zero) / (S.rend_top - S.rend_zero)) * 100;
  const sPrez = val.sconto == null ? 50 : clamp((val.sconto - S.sconto_zero) / (S.sconto_top - S.sconto_zero)) * 100;
  let sAff = AFFID[(im.stato || "").toLowerCase()] ?? 70;
  if (use && sc.list[use].stima) sAff -= 15;
  if (val.valore == null) sAff -= 20;
  sAff = clamp(sAff, 0, 100);
  const score = use ? Math.round(S.pesi.rendimento * sRend + S.pesi.prezzo * sPrez + S.pesi.affidabilita * sAff) : null;
  return { im, val, sc, best, use, rend: r, score, parts: { sRend, sPrez, sAff } };
}
function stato(score) {
  if (score == null) return { c: "", t: "Dati mancanti", col: "#5b6b95" };
  if (score >= 70) return { c: "s-good", t: "Affare", col: "#22c55e" };
  if (score >= 50) return { c: "s-warn", t: "Da valutare", col: "#f59e0b" };
  return { c: "s-bad", t: "Debole", col: "#ef4444" };
}

/* ============ dati ============ */
const SRC = { miei: () => MIEI, auto: () => AUTO };
const findIm = (src, id) => (SRC[src] ? SRC[src]() : []).find(x => x.id === id);
const oggi = new Date().toISOString().slice(0, 10);

/* ============ componenti ============ */
function cardIm(A, src, rank) {
  const im = A.im, st = stato(A.score);
  const r = A.use ? A.sc.list[A.use] : null;
  return `<a class="im" href="#imm/${src}/${encodeURIComponent(im.id)}">
    ${win(im, st.col, `<span class="pill" style="--pc:${st.col}">${A.score ?? "—"}</span>`)}
    ${rank ? `<span class="rank">${rank}</span>` : ""}
    <div class="imt">
      <div class="loc">${esc([im.comune, im.zona].filter(Boolean).join(" · "))}</div>
      <h3>${esc(im.titolo || "Immobile")}</h3>
      <div class="meta"><b>${eur(im.prezzo)}</b> · ${num(im.mq)} m² · ${eur(A.val.prezzoMq)}/m²</div>
      <div class="meta">Netto <b>${pct(A.rend)}</b>${A.val.sconto != null ? ` · ${A.val.sconto >= 0 ? "sotto" : "sopra"} mercato <b>${pct(Math.abs(A.val.sconto), 0)}</b>` : ""}</div>
      <div class="tags"><span class="tag st ${st.c}">${st.t}</span>${A.use ? `<span class="tag cat">${CATS[A.use]}</span>` : ""}${r && r.stima ? `<span class="tag est">stima</span>` : ""}${src === "auto" && im.trovato === oggi ? `<span class="tag new">nuovo oggi</span>` : ""}${src === "auto" && im.promosso ? "" : ""}</div>
    </div>
  </a>`;
}
function win(im, col, pill) {
  return `<div class="win" style="--wc:${col}"><span class="ini">${esc((im.comune || "?")[0])}</span>${im.foto ? `<img src="${esc(im.foto)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.remove()">` : ""}${pill || ""}</div>`;
}
let maps = [];
function drawMap(el, points, opts = {}) {
  if (!window.L) { el.innerHTML = `<div class="mapfb">Mappa non disponibile senza connessione.</div>`; return; }
  const m = L.map(el, { zoomControl: false, attributionControl: true, scrollWheelZoom: false });
  L.control.zoom({ position: "bottomright" }).addTo(m);
  L.tileLayer("https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png", {
    maxZoom: 19, subdomains: "abcd",
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> &copy; <a href="https://carto.com/">CARTO</a>'

  else if (b.length === 1) m.setView(b[0], opts.zoom || 13);

function vbar(im, V) {
  const o = im.valutazione?.omi;
  const vals = [V.prezzoMq, V.valMq, V.compMq, o?.min, o?.max, o?.medio, ...V.comps.map(c => c.prezzo / c.mq)].filter(x => x != null && isFinite(x));
  if (vals.length < 2) return "";
  let lo = Math.min(...vals), hi = Math.max(...vals); const pad = (hi - lo) * 0.12 || hi * 0.1; lo -= pad; hi += pad;
  const W = 360, X = v => 40 + (v - lo) / (hi - lo) * (W - 80), y = 44;
  let s = `<svg viewBox="0 0 ${W} 100" role="img" aria-label="Prezzo al metro quadro rispetto al mercato">`;
  s += `<line x1="30" x2="${W - 30}" y1="${y}" y2="${y}" stroke="rgba(255,255,255,.18)" stroke-width="2" stroke-linecap="round"/>`;
  if (o?.min && o?.max) s += `<rect x="${X(o.min)}" y="${y - 9}" width="${Math.max(2, X(o.max) - X(o.min))}" height="18" rx="4" fill="rgba(0,200,224,.18)" stroke="rgba(125,243,255,.35)"/>`;
  if (o?.medio && !(o?.min && o?.max)) s += `<rect x="${X(o.medio) - 3}" y="${y - 9}" width="6" height="18" rx="3" fill="rgba(0,200,224,.55)"><title>OMI ${num(o.medio)} €/m²</title></rect>`;
  for (const c of V.comps) s += `<circle cx="${X(c.prezzo / c.mq)}" cy="${y}" r="5" fill="#ff2bd6" stroke="#0a1220" stroke-width="2"><title>${esc(c.titolo || "Comparabile")}: ${num(c.prezzo / c.mq)} €/m²</title></circle>`;
  const mark = (v, col, lab, up) => v == null ? "" : `<line x1="${X(v)}" x2="${X(v)}" y1="${y - 14}" y2="${y + 14}" stroke="${col}" stroke-width="3" stroke-linecap="round"/><text x="${X(v)}" y="${up ? y - 32 : y + 30}" fill="#e6f7ff" font-size="12" font-weight="700" text-anchor="middle" font-family="Barlow,sans-serif">${lab}</text><text x="${X(v)}" y="${up ? y - 18 : y + 44}" fill="#b3cde4" font-size="11" text-anchor="middle" font-family="Barlow,sans-serif">${num(v)} €/m²</text>`;
    s += mark(V.valMq, "#7df3ff", "Valore stimato", false);
  s += mark(V.prezzoMq, "#facc15", "Prezzo chiesto", true);
  s += `</svg>`;
  return `<div class="vbar">${s}</div><div class="legend"><span><i style="background:#facc15;color:#facc15"></i>Prezzo chiesto</span><span><i style="background:#7df3ff;color:#7df3ff"></i>Valore stimato</span>${im.valutazione?.omi?.min ? `<span><i style="background:rgba(0,200,224,.35);border-radius:3px;color:transparent"></i>Forbice OMI</span>` : im.valutazione?.omi?.medio ? `<span><i style="background:rgba(0,200,224,.55);border-radius:3px;color:transparent"></i>Valore OMI</span>` : ""}${V.comps.length ? `<span><i style="background:#ff2bd6;color:#ff2bd6"></i>Comparabili</span>` : ""}</div>`;
}
function season(m) {
  const W = 360, H = 150, b = 22, top = 18, ch = H - b - top, bw = (W - 20) / 12;
  const mx = Math.max(...m), mn = Math.min(...m);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Occupazione per mese">`;
  [0.25, 0.5, 0.75, 1].forEach(t => s += `<line x1="10" x2="${W - 10}" y1="${top + ch * (1 - t)}" y2="${top + ch * (1 - t)}" stroke="rgba(255,255,255,.06)"/>`);
  m.forEach((v, i) => {
    const h = Math.max(3, ch * v), x = 10 + i * bw + 3, y = top + ch - h, w = bw - 6;
    s += `<path class="bar" data-tip="${MESI[i]}: ${pct(v, 0)}" d="M${x},${top + ch} V${y + 4} q0,-4 4,-4 h${w - 8} q4,0 4,4 V${top + ch} Z" fill="${v >= 0.7 ? "#7df3ff" : v >= 0.45 ? "#00a3b8" : "#0e4a5e"}"/>`;
    s += `<rect x="${10 + i * bw}" y="${top}" width="${bw}" height="${ch}" fill="transparent" data-tip="${MESI[i]}: ${pct(v, 0)}"/>`;
    s += `<text x="${x + w / 2}" y="${H - 8}" fill="#8fb0d0" font-size="10" text-anchor="middle" font-family="Barlow,sans-serif">${MESI[i][0]}</text>`;
    if (v === mx || v === mn) s += `<text x="${x + w / 2}" y="${y - 5}" fill="#e6f7ff" font-size="10.5" font-weight="700" text-anchor="middle" font-family="Barlow,sans-serif">${pct(v, 0)}</text>`;
  });
  return s + `</svg><div class="legend"><span><i style="background:#7df3ff;color:#7df3ff"></i>Alta (70%+)</span><span><i style="background:#00a3b8;color:#00a3b8"></i>Media</span><span><i style="background:#0e4a5e;color:transparent"></i>Bassa (sotto 45%)</span></div>`;
}
function afterScheda(src, id) {
  const im = findIm(src, id); if (!im) return;
  $("#scen")?.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (!b) return; store.set("scen_" + im.id, b.dataset.k); render(true); });
  const el = $("#cmap");
  if (el) drawMap(el, [...(im.valutazione?.comparabili || []).map(c => ({ lat: c.lat, lng: c.lng, col: "#ff2bd6", r: 7,
      tip: `${esc(c.titolo || "")} · ${num(c.prezzo / c.mq)} €/m²` })),
    { lat: im.lat, lng: im.lng, col: "#facc15", r: 11, tip: "Questo immobile" }], { maxZoom: 15 });
}

/* ---- notizie ---- */
const TIPI = { trasporti: "Trasporti", turismo: "Turismo", eventi: "Eventi", normative: "Normative", mercato: "Mercato", urbanistica: "Urbanistica" };
function cardNews(n) {
  const d = n.data ? new Date(n.data + "T12:00").toLocaleDateString("it-IT", { day: "numeric", month: "short" }) : "";
  return `<a class="nw" href="${esc(n.url || "#notizie")}" ${n.url ? 'target="_blank" rel="noopener"' : ""}>
    <div class="hd"><span>${d}</span>${n.tipo ? `<span class="tag cat">${esc(TIPI[n.tipo] || n.tipo)}</span>` : ""}<span>${esc([n.comune, n.regione].filter(Boolean).join(", "))}</span></div>
    <h3>${esc(n.titolo)}</h3><p>${esc(n.riassunto || "")}</p>
    ${n.impatto ? `<div class="imp">→ ${esc(n.impatto)}${n.quando ? ` · ${esc(n.quando)}` : ""}</div>` : ""}
    ${n.fonte ? `<div class="src" style="margin-top:6px">${esc(n.fonte)}</div>` : ""}</a>`;
}
function vNotizie() {
  const f = store.get("f_news", { tipo: "", reg: "" });
  const regs = [...new Set(NOTIZIE.map(n => n.regione).filter(Boolean))].sort();
  const list = NOTIZIE.filter(n => (!f.tipo || n.tipo === f.tipo) && (!f.reg || n.regione === f.reg)).sort((a, b) => (b.data || "").localeCompare(a.data || ""));
  return `<h1>Notizie</h1><p class="sub">Novità che possono far crescere una zona: trasporti, turismo, eventi, regole. Aggiornate ogni mattina alle 10.</p>
  ${NOTIZIE.length ? `<div class="filters" id="nf">
    <div class="chips"><button class="chip ${!f.tipo ? "on" : ""}" data-t="">Tutte</button>${Object.entries(TIPI).map(([k, t]) => `<button class="chip ${f.tipo === k ? "on" : ""}" data-t="${k}">${t}</button>`).join("")}</div>
    <select data-f="reg"><option value="">Tutte le regioni</option>${regs.map(r => `<option ${r === f.reg ? "selected" : ""}>${esc(r)}</option>`).join("")}</select></div>
    <div class="list">${list.length ? list.map(cardNews).join("") : `<p class="sub">Nessuna notizia con questi filtri.</p>`}</div>`
    : `<div style="margin-top:14px">${emptyBox("Nessuna notizia ancora", `<p>Quando attiveremo l'aggiornamento automatico, ogni mattina qui arriveranno le notizie utili per investire, con il riassunto e l'impatto sulla zona.</p>`)}</div>`}`;
}
function afterNotizie() {
  const box = $("#nf"); if (!box) return; const f = store.get("f_news", { tipo: "", reg: "" });
  box.addEventListener("click", e => { const c = e.target.closest("[data-t]"); if (c) { f.tipo = c.dataset.t; store.set("f_news", f); render(); } });
  box.addEventListener("change", e => { f.reg = e.target.value; store.set("f_news", f); render(); });
}

/* ---- guida ---- */
function cardGuida(g) { return `<a class="gd" href="#guida/${g.id}"><small>${esc(g.categoria)}</small><h3>${esc(g.titolo)}</h3><p>${esc(g.intro)}</p></a>`; }
function vGuida(id) {
  if (id) {
    const g = GUIDA.find(x => x.id === id);
    if (!g) return `<a class="back" href="#guida">← Guida</a>${emptyBox("Articolo non trovato", "")}`;
    return `<a class="back" href="#guida">← Guida</a><div class="loc">${esc(g.categoria)}</div><h1 style="margin-top:4px">${esc(g.titolo)}</h1>
      <p class="sub" style="font-size:15px">${esc(g.intro)}</p><div class="art">${md(g.testo)}</div>`;
  }
  const cats = [...new Set(GUIDA.map(g => g.categoria))];
  return `<h1>Guida</h1><p class="sub">Come investire: zone, valutazione, rendimenti e aspetti pratici.</p>
    ${cats.map(c => `<h2>${esc(c)}</h2><div class="list">${GUIDA.filter(g => g.categoria === c).map(cardGuida).join("")}</div>`).join("")}`;
}
function md(t) {
  const inl = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>");
  return t.trim().split(/\n\s*\n/).map(b => {
    const L = b.split("\n");
    if (L[0].startsWith("## ")) { const rest = L.slice(1).join("\n"); return `<h2>${inl(L[0].slice(3))}</h2>` + (rest ? md(rest) : ""); }
    if (L.every(l => l.startsWith("- "))) return `<ul>${L.map(l => `<li>${inl(l.slice(2))}</li>`).join("")}</ul>`;
    return `<p>${inl(b)}</p>`;
  }).join("");
}

/* ============ router ============ */
function render(keepScroll) {
  maps.forEach(m => m.remove()); maps = [];
  const [v, a, b] = (location.hash.slice(1) || "home").split("/").map(decodeURIComponent);
  const app = $("#app"), y = window.scrollY;
  let html, after = () => {};
  if (v === "miei" || v === "auto") { html = vLista(v); after = () => afterLista(v); }
  else if (v === "imm") { html = vScheda(a, b); after = () => afterScheda(a, b); }
  else if (v === "notizie") { html = vNotizie(); after = afterNotizie; }
  else if (v === "guida") html = vGuida(a);
  else if (TERR_VIEWS[v]) { html = TERR_VIEWS[v][0](a); after = () => TERR_VIEWS[v][1](a); }
  else { html = vHome(); after = afterHome; }
  app.innerHTML = html; after();
  const navv = v === "imm" ? a : v || "home";
  document.querySelectorAll("#nav a").forEach(x => { const on = x.dataset.v === navv; x.classList.toggle("on", on); if (on) x.scrollIntoView({ inline: "nearest", block: "nearest" }); });
  document.querySelectorAll(".taxsw button").forEach(x => x.classList.toggle("on", x.dataset.tax === TAX));
  window.scrollTo(0, keepScroll ? y : 0);
}
window.addEventListener("hashchange", () => render());
document.querySelector(".taxsw").addEventListener("click", e => { const b = e.target.closest("[data-tax]"); if (!b) return; TAX = b.dataset.tax; store.set("tax", TAX); render(true); });
/* tooltip dei grafici */
const tip = $("#tip");
["pointermove","pointerdown"].forEach(ev => document.addEventListener(ev, e => { const t = e.target.closest?.("[data-tip]"); if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false; tip.style.left = Math.min(e.clientX + 12, innerWidth - tip.offsetWidth - 8) + "px"; tip.style.top = (e.clientY - 34) + "px"; }));
render();
</script>
</body>
